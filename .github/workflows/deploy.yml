
name: Deploy Encore app

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Encore
        run: |
          curl -L https://encore.dev/install.sh | bash

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          ~/.encore/bin/encore build docker --config=infra-config.json peralta-sh

      - name: Tag Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/peralta-sh"
          docker tag peralta-sh "$IMAGE:latest"
          docker tag peralta-sh "$IMAGE:${GITHUB_SHA}"

      - name: Push Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/peralta-sh"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/peralta-sh
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

